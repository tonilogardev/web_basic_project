name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main
      - main_dev_pro

jobs:
  deploy:
    name: Push to Production
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el código fuente
        uses: actions/checkout@v4

      - name: Copiar archivos al servidor
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/opt/gis_platform"
          exclude: ".git*,.github*,001_documentation,002_ssh_key,003_terraform,007_format_transformation,.agents,dev_run.sh,logica_*,*.md,LICENSE,.env.development"

      - name: Despliegue con Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/gis_platform
            
            # Limpiar contenedores fantasma si existen
            docker compose down || true
            
            # Cargar el entorno purista dinámicamente param saltar la restricción del .gitignore
            echo "${{ secrets.PROD_ENV_FILE }}" > .env
            
            # Preparar escudo de volumen ACME param mantener los SSL sin agotar límites
            mkdir -p letsencrypt
            touch letsencrypt/acme.json
            chmod 600 letsencrypt/acme.json
            
            # Reconstruir imágenes estáticas y levantar orquestador
            docker compose up --build -d
            
            # Limpiar imágenes colgadas param ahorrar SSD (Menos es Más)
            docker image prune -f
