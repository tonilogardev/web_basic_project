name: Build Images and Deploy to Hetzner VPS

on:
  push:
    branches:
      - main
      - main_dev_pro

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Clonar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticación en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cargar variables de entorno param compilación
        run: |
          echo "${{ secrets.PROD_ENV_FILE }}" > .env

      - name: Compilar y publicar imágenes en GHCR
        run: |
          docker compose build
          docker compose push

  deploy:
    name: Deploy to Hetzner VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el código fuente
        uses: actions/checkout@v4

      - name: Sincronizar archivos de orquestación al servidor
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/opt/gis_platform"
          exclude: ".git*,.github*,001_documentation,002_ssh_key,003_terraform,007_format_transformation,.agents,dev_run.sh,logica_*,*.md,LICENSE,.env.development,011_tfb/visualizations/SCL_UNET_catalonia,011_tfb/000_doc_tfb,011_tfb/ppt"

      - name: Despliegue en caliente con Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/gis_platform
            
            # Cargar el entorno de producción
            echo "${{ secrets.PROD_ENV_FILE }}" > .env
            
            # Preparar escudo de volumen ACME param mantener los SSL
            mkdir -p letsencrypt
            touch letsencrypt/acme.json
            chmod 600 letsencrypt/acme.json
            
            # Descargar imágenes precompiladas de GHCR
            docker compose pull
            
            # Desplegar o actualizar contenedores en caliente (Zero Downtime)
            docker compose up -d --remove-orphans
            
            # Limpiar imágenes obsoletas param ahorrar SSD (Menos es Más)
            docker image prune -f
