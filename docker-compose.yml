services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    environment:
      - DOCKER_API_VERSION=1.41
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.certResolver=myresolver"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${LETSENCRYPT_EMAIL:-tologar@gmail.com}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      # Absorbe dinámicamente el puerto del .env (8001 local contra el 80 que será en prod)
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.http-catchall.rule=${TRAEFIK_HTTPS_RULE:-Host(`none`)}"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - traefik-net

  homepage:
    container_name: homepage
    build:
      context: ./004_homepage
      dockerfile: Dockerfile
      args:
        VITE_SENTINEL_URL: "${SENTINEL_URL}"
        VITE_CASSINI_URL: "${CASSINI_URL}"
        VITE_DEV_WEB_URL: "${DEV_WEB_URL}"
        VITE_TFB_VIEWER_URL: "${TFB_VIEWER_URL}"
    restart: always
    # ELIMINADO env_file: No requerimos que el servidor estático "Nginx" asimile .envs crudos
    labels:
      - "traefik.enable=true"
      # Magia dinámica: Si la variable falla, fallback brutal a localhost
      - "traefik.http.routers.homepage.rule=Host(`homepage.${DOMAIN_NAME:-localhost}`) || Host(`${DOMAIN_NAME:-localhost}`)"
      - "traefik.http.routers.homepage.entrypoints=web,websecure"
    networks:
      - traefik-net

  cassini-hackathons:
    container_name: cassini_hackathons
    build:
      context: ./006_cassini_hackathons
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./006_cassini_hackathons/public/images:/usr/share/nginx/html/images
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cassini.rule=Host(`cassini.${DOMAIN_NAME:-localhost}`)"
      - "traefik.http.routers.cassini.entrypoints=web,websecure"
    networks:
      - traefik-net

  dev-web-frontend:
    container_name: dev_web_frontend
    build:
      context: ./009_dev_web/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${DEV_WEB_API_URL}"
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.devwebfrontend.rule=Host(`dev-web.${DOMAIN_NAME:-localhost}`)"
      - "traefik.http.routers.devwebfrontend.entrypoints=web,websecure"
    networks:
      - traefik-net

  dev-web-backend:
    container_name: dev_web_backend
    build:
      context: ./009_dev_web/backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: "${DEV_WEB_DB_URL}"
      JWT_SECRET: "${DEV_WEB_JWT_SECRET}"
      ETL_API_KEY: "${ETL_API_KEY:-default-secret-key}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.devwebbackend.rule=Host(`api.dev-web.${DOMAIN_NAME:-localhost}`)"
      - "traefik.http.routers.devwebbackend.entrypoints=web,websecure"
      - "traefik.http.services.devwebbackend.loadbalancer.server.port=3000"
    networks:
      - traefik-net
    depends_on:
      - dev-web-db

  dev-web-etl-worker:
    container_name: dev_web_etl_worker
    build:
      context: ./009_dev_web/010_etl_worker
      dockerfile: Dockerfile
    restart: always
    environment:
      # Internal routing since they are in the same docker network
      BACKEND_API_URL: "http://dev-web-backend:3000"
      ETL_API_KEY: "${ETL_API_KEY:-default-secret-key}"
      CRON_SCHEDULE: "*/15 17 * * *"
    networks:
      - traefik-net
    depends_on:
      - dev-web-backend

  dev-web-db:
    image: postgres:16-alpine
    container_name: dev_web_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: datasphere
    volumes:
      - dev_web_postgres_data:/var/lib/postgresql/data
      - ./009_dev_web/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - traefik-net

  sentinel-viewer:
    container_name: sentinel_viewer
    build:
      context: ./005_sentinel_viewer
      dockerfile: Dockerfile
    restart: always
    labels:
      - "traefik.enable=true"
      # Subdominio asilado y gobernado dinámicamente:
      - "traefik.http.routers.sentinel.rule=Host(`sentinel.${DOMAIN_NAME:-localhost}`)"
      - "traefik.http.routers.sentinel.entrypoints=web,websecure"
    networks:
      - traefik-net

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: titiler
    restart: always
    expose:
      - "80"
    environment:
      # CORS necesario porque el frontend (sentinel.*) pide tiles a titiler.*
      - TITILER_CORS_ORIGINS=*
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.titiler.rule=Host(`titiler.${DOMAIN_NAME:-localhost}`)"
      - "traefik.http.routers.titiler.entrypoints=web,websecure"
      - "traefik.http.services.titiler.loadbalancer.server.port=80"
    networks:
      - traefik-net

  water-quality-api:
    container_name: water_quality_api
    build:
      context: ./008_water_quality_api
      dockerfile: Dockerfile
    restart: always
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.waterapi.rule=Host(`water-api.${DOMAIN_NAME:-localhost}`)"
      - "traefik.http.routers.waterapi.entrypoints=web,websecure"
      - "traefik.http.services.waterapi.loadbalancer.server.port=8000"
    networks:
      - traefik-net

  tfb-viewer:
    container_name: tfb_viewer
    build:
      context: ./011_tfb/viewer
      dockerfile: Dockerfile
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tfbviewer.rule=Host(`tfb-viewer.${DOMAIN_NAME:-localhost}`)"
      - "traefik.http.routers.tfbviewer.entrypoints=web,websecure"
    networks:
      - traefik-net

networks:
  traefik-net:
    driver: bridge

volumes:
  dev_web_postgres_data:
