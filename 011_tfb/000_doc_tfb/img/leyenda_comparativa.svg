<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" rx="15"/>
<defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666" />
    </marker>
</defs>
<style>
.title { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1e1e1e; }
.label { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; fill: #1e1e1e; }
.box { stroke: #1e1e1e; stroke-width: 1.5; }
.arrow { stroke: #666666; stroke-width: 1.0; fill: none; marker-end: url(#arrowhead); }
</style>
<text x="50" y="50" class="title">Máscara ESA Sentinel-2 (12 Clases)</text>
<text x="550" y="50" class="title">Ground Truth (6 Clases)</text>

<!-- Left side (12 classes) -->
<rect x="50" y="100" width="30" height="30" fill="#000000" class="box" rx="5"/>
<text x="95" y="120" class="label">0: NO DATA</text>
<rect x="50" y="145" width="30" height="30" fill="#ff0000" class="box" rx="5"/>
<text x="95" y="165" class="label">1: SATURATED / DEFECT</text>
<rect x="50" y="190" width="30" height="30" fill="#2f2f2f" class="box" rx="5"/>
<text x="95" y="210" class="label">2: DARK AREA PIXELS</text>
<rect x="50" y="235" width="30" height="30" fill="#643200" class="box" rx="5"/>
<text x="95" y="255" class="label">3: CLOUD SHADOWS</text>
<rect x="50" y="280" width="30" height="30" fill="#00ff00" class="box" rx="5"/>
<text x="95" y="300" class="label">4: VEGETATION</text>
<rect x="50" y="325" width="30" height="30" fill="#ffff00" class="box" rx="5"/>
<text x="95" y="345" class="label">5: BARE SOILS</text>
<rect x="50" y="370" width="30" height="30" fill="#0000ff" class="box" rx="5"/>
<text x="95" y="390" class="label">6: WATER</text>
<rect x="50" y="415" width="30" height="30" fill="#808080" class="box" rx="5"/>
<text x="95" y="435" class="label">7: UNCLASSIFIED</text>
<rect x="50" y="460" width="30" height="30" fill="#c0c0c0" class="box" rx="5"/>
<text x="95" y="480" class="label">8: CLOUD (MEDIUM PROB)</text>
<rect x="50" y="505" width="30" height="30" fill="#ffffff" class="box" rx="5"/>
<text x="95" y="525" class="label">9: CLOUD (HIGH PROB)</text>
<rect x="50" y="550" width="30" height="30" fill="#64c8ff" class="box" rx="5"/>
<text x="95" y="570" class="label">10: THIN CIRRUS</text>
<rect x="50" y="595" width="30" height="30" fill="#ff96ff" class="box" rx="5"/>
<text x="95" y="615" class="label">11: SNOW / ICE</text>

<!-- Right side (6 classes) -->
<rect x="550" y="150" width="30" height="30" fill="#000000" class="box" rx="5"/>
<text x="595" y="170" class="label" font-weight="bold">0: NO DATA (Negro)</text>
<rect x="550" y="225" width="30" height="30" fill="#ffffff" class="box" rx="5"/>
<text x="595" y="245" class="label" font-weight="bold">1: NUBE (Blanco)</text>
<rect x="550" y="300" width="30" height="30" fill="#808080" class="box" rx="5"/>
<text x="595" y="320" class="label" font-weight="bold">2: SOMBRA (Gris)</text>
<rect x="550" y="375" width="30" height="30" fill="#00ffff" class="box" rx="5"/>
<text x="595" y="395" class="label" font-weight="bold">3: NIEVE (Cian)</text>
<rect x="550" y="450" width="30" height="30" fill="#00ff00" class="box" rx="5"/>
<text x="595" y="470" class="label" font-weight="bold">4: VEG/SUELO (Verde)</text>
<rect x="550" y="525" width="30" height="30" fill="#0000ff" class="box" rx="5"/>
<text x="595" y="545" class="label" font-weight="bold">5: AGUA (Azul)</text>

<!-- Mapping arrows (12 -> 6) -->
<path d="M 330,115 C 440,115 440,165 540,165" class="arrow" />
<path d="M 330,160 C 440,160 440,165 540,165" class="arrow" />
<path d="M 330,430 C 440,430 440,165 540,165" class="arrow" />

<path d="M 330,475 C 440,475 440,240 540,240" class="arrow" />
<path d="M 330,520 C 440,520 440,240 540,240" class="arrow" />
<path d="M 330,565 C 440,565 440,240 540,240" class="arrow" />

<path d="M 330,205 C 440,205 440,315 540,315" class="arrow" />
<path d="M 330,250 C 440,250 440,315 540,315" class="arrow" />

<path d="M 330,610 C 440,610 440,390 540,390" class="arrow" />

<path d="M 330,295 C 440,295 440,465 540,465" class="arrow" />
<path d="M 330,340 C 440,340 440,465 540,465" class="arrow" />

<path d="M 330,385 C 440,385 440,540 540,540" class="arrow" />
</svg>