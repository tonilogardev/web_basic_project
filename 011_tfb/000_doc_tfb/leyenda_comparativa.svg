<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">\n<rect width="100%" height="100%" fill="#ffffff" rx="15"/>\n<style>\n.title { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1e1e1e; }\n.label { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 15px; fill: #1e1e1e; }\n.box { stroke: #1e1e1e; stroke-width: 2; }\n.arrow { stroke: #1e1e1e; stroke-width: 1.5; fill: none; stroke-dasharray: 4,4; }\n</style>\n<text x="50" y="50" class="title">Máscara ESA Sentinel-2 (12 Clases)</text>\n<text x="550" y="50" class="title">Nuestra Ground Truth (6 Clases)</text>\n<rect x="50" y="100" width="30" height="30" fill="#000000" class="box" rx="5"/>\n<text x="95" y="120" class="label">0: NO DATA</text>\n<rect x="50" y="145" width="30" height="30" fill="#ff0000" class="box" rx="5"/>\n<text x="95" y="165" class="label">1: SATURATED / DEFECT</text>\n<rect x="50" y="190" width="30" height="30" fill="#2f2f2f" class="box" rx="5"/>\n<text x="95" y="210" class="label">2: DARK AREA PIXELS</text>\n<rect x="50" y="235" width="30" height="30" fill="#643200" class="box" rx="5"/>\n<text x="95" y="255" class="label">3: CLOUD SHADOWS</text>\n<rect x="50" y="280" width="30" height="30" fill="#00ff00" class="box" rx="5"/>\n<text x="95" y="300" class="label">4: VEGETATION</text>\n<rect x="50" y="325" width="30" height="30" fill="#ffff00" class="box" rx="5"/>\n<text x="95" y="345" class="label">5: BARE SOILS</text>\n<rect x="50" y="370" width="30" height="30" fill="#0000ff" class="box" rx="5"/>\n<text x="95" y="390" class="label">6: WATER</text>\n<rect x="50" y="415" width="30" height="30" fill="#808080" class="box" rx="5"/>\n<text x="95" y="435" class="label">7: UNCLASSIFIED</text>\n<rect x="50" y="460" width="30" height="30" fill="#c0c0c0" class="box" rx="5"/>\n<text x="95" y="480" class="label">8: CLOUD (MEDIUM PROB)</text>\n<rect x="50" y="505" width="30" height="30" fill="#ffffff" class="box" rx="5"/>\n<text x="95" y="525" class="label">9: CLOUD (HIGH PROB)</text>\n<rect x="50" y="550" width="30" height="30" fill="#64c8ff" class="box" rx="5"/>\n<text x="95" y="570" class="label">10: THIN CIRRUS</text>\n<rect x="50" y="595" width="30" height="30" fill="#ff96ff" class="box" rx="5"/>\n<text x="95" y="615" class="label">11: SNOW / ICE</text>\n<rect x="550" y="150" width="30" height="30" fill="#000000" class="box" rx="5"/>\n<text x="595" y="170" class="label" font-weight="bold">0: NO DATA (Negro)</text>\n<rect x="550" y="225" width="30" height="30" fill="#ffffff" class="box" rx="5"/>\n<text x="595" y="245" class="label" font-weight="bold">1: NUBE (Blanco)</text>\n<rect x="550" y="300" width="30" height="30" fill="#808080" class="box" rx="5"/>\n<text x="595" y="320" class="label" font-weight="bold">2: SOMBRA (Gris)</text>\n<rect x="550" y="375" width="30" height="30" fill="#00ffff" class="box" rx="5"/>\n<text x="595" y="395" class="label" font-weight="bold">3: NIEVE (Cian)</text>\n<rect x="550" y="450" width="30" height="30" fill="#00ff00" class="box" rx="5"/>\n<text x="595" y="470" class="label" font-weight="bold">4: VEG/SUELO (Verde)</text>\n<rect x="550" y="525" width="30" height="30" fill="#0000ff" class="box" rx="5"/>\n<text x="595" y="545" class="label" font-weight="bold">5: AGUA (Azul)</text>\n<path d="M 330,115 C 440,115 440,165 530,165" class="arrow" />\n<path d="M 330,160 C 440,160 440,165 530,165" class="arrow" />\n<path d="M 330,430 C 440,430 440,165 530,165" class="arrow" />\n<path d="M 330,475 C 440,475 440,240 530,240" class="arrow" />\n<path d="M 330,520 C 440,520 440,240 530,240" class="arrow" />\n<path d="M 330,565 C 440,565 440,240 530,240" class="arrow" />\n<path d="M 330,205 C 440,205 440,315 530,315" class="arrow" />\n<path d="M 330,250 C 440,250 440,315 530,315" class="arrow" />\n<path d="M 330,610 C 440,610 440,390 530,390" class="arrow" />\n<path d="M 330,295 C 440,295 440,465 530,465" class="arrow" />\n<path d="M 330,340 C 440,340 440,465 530,465" class="arrow" />\n<path d="M 330,385 C 440,385 440,540 530,540" class="arrow" />\n</svg>